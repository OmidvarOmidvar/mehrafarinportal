<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>پورتال کارکنان مهرآفرین</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== توکن‌های طراحی ===== */
:root{--navy:#1B508C;--navy-d:#063972;--teal:#01A0BE;--turq:#00B6CE;--gold:#B48B15;
--navy-t:#E9EFF6;--teal-t:#E5F5F8;--gold-t:#F8F2DE;--bg:#F3FAFC;--g1:#F4F7FA;--g2:#DCE3EB;--g5:#566373;--tx:#1B2735;--r:16px;
--sh:0 2px 10px rgba(6,57,114,.08);color-scheme:light}
*{box-sizing:border-box;margin:0}
body{font:400 15px/1.8 Vazirmatn,Tahoma,sans-serif;color:var(--tx);background:var(--bg);padding-top:env(safe-area-inset-top,0)}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;font-weight:800;color:var(--navy-d)}h2{font-size:17px;font-weight:700;color:var(--navy-d)}h3{font-size:15px;font-weight:600}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--navy);color:#fff;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;z-index:30}
aside .brand{display:flex;align-items:center;gap:8px;padding:4px 8px 16px;font-weight:800;font-size:18px}
aside a{display:flex;gap:10px;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#dbe7f5;text-decoration:none;margin-bottom:2px}
aside a:hover{background:rgba(255,255,255,.1)}aside a.on{background:#fff;color:var(--navy-d);font-weight:600}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--g2);position:sticky;top:0;z-index:20}
.top .sp{flex:1}.top select{min-height:40px;border:1px solid var(--g2);border-radius:10px;padding:0 8px;background:#fff}
main{padding:20px;max-width:1100px;margin:auto;width:100%}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--navy);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--navy-d)}.btn.ghost{background:var(--teal-t);color:var(--navy-d)}.btn.gold{background:var(--gold)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:44px;padding:0 12px}.ib{width:44px;height:44px;border:0;background:none;border-radius:12px;cursor:pointer;display:inline-grid;place-items:center;color:var(--navy)}.ib:hover{background:var(--teal-t)}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;border:1px solid #e8eef4}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mut{color:var(--g5);font-size:14px}
.av{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none}.av.lg{width:84px;height:84px;font-size:32px}
.bdg{font-size:14px;padding:0 10px;border-radius:99px;background:var(--teal-t);color:var(--navy-d);display:inline-block}.bdg.g{background:var(--gold-t);color:#6d5200}.bdg.n{background:var(--navy-t)}.bdg.r{background:#fde8e8;color:#8a1f1f}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--g2);margin-bottom:16px;overflow:auto}.tabs button{min-height:44px;padding:0 16px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;color:var(--g5);white-space:nowrap}.tabs .on{color:var(--teal);border-color:var(--teal);font-weight:700}
input,select,textarea{border:1px solid var(--g2);border-radius:12px;padding:8px 12px;background:#fff;min-height:44px;width:100%}
.srch{position:relative;flex:1;min-width:180px}.srch .ic{position:absolute;right:12px;top:12px;color:var(--g5)}.srch input{padding-right:40px}
.hero{background:linear-gradient(135deg,var(--gold-t),#fff);border:1px solid #ecdca4;position:relative;overflow:hidden}
.petal{position:absolute;pointer-events:none;opacity:.12}
.empty{text-align:center;padding:32px 12px;color:var(--g5)}
.sticky{padding:12px;border-radius:6px 6px 16px 6px;min-height:130px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}.sticky textarea{background:transparent;border:0;flex:1;resize:none;min-height:70px;padding:0}
.ov{position:fixed;inset:0;background:rgba(6,57,114,.45);display:grid;place-items:center;z-index:60;padding:16px}.mod{background:#fff;border-radius:20px;padding:20px;width:min(520px,100%);max-height:88vh;overflow:auto}
.chat{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 150px);min-height:420px;padding:0;overflow:hidden}
.chat .list{border-left:1px solid var(--g2);overflow:auto;padding:8px}.chat .li{display:flex;gap:8px;align-items:center;width:100%;min-height:48px;padding:6px 8px;border:0;background:none;border-radius:12px;cursor:pointer;text-align:right}.chat .li.on{background:var(--teal-t)}
.conv{display:flex;flex-direction:column;min-height:0}#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--g1)}
.b{max-width:75%;padding:8px 14px;border-radius:16px 16px 16px 4px;background:#fff;box-shadow:var(--sh)}.b.me{align-self:flex-start;background:var(--navy);color:#fff;border-radius:16px 16px 4px 16px}.b small{display:block;opacity:.7;font-size:14px}
.lk{border:0;background:none;cursor:pointer;color:inherit;display:inline-flex;align-items:center;gap:2px;opacity:.8;min-height:32px}.lk.on{color:#d6455d}
.dot{width:10px;height:10px;border-radius:50%;background:var(--turq);display:inline-block}
table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:10px;border-bottom:1px solid var(--g2)}th{color:var(--g5);font-weight:600;font-size:14px}
.pb{height:10px;background:var(--navy-t);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--turq));transition:width .4s}
.fab{position:fixed;left:20px;bottom:20px;z-index:40;width:56px;height:56px;border-radius:50%;border:0;background:var(--teal);color:#fff;box-shadow:0 6px 18px rgba(1,160,190,.5);cursor:pointer;display:grid;place-items:center}
.bot{position:fixed;left:20px;bottom:88px;width:min(340px,calc(100vw - 32px));z-index:40;padding:0;overflow:hidden}.bot header{background:var(--navy);color:#fff;padding:12px 16px}.bot .bm{padding:12px;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;bottom:84px;right:50%;transform:translateX(50%);background:var(--navy-d);color:#fff;padding:10px 20px;border-radius:99px;z-index:80}
.bn{display:none}.menuBtn{display:none}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,#d4f1f6,#fff 60%);position:relative;overflow:hidden;padding:16px}
.login .card{width:min(400px,100%);position:relative;padding:28px}
@media(max-width:1024px){.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
.app{display:block;padding-bottom:64px}aside{position:fixed;right:0;top:0;width:260px;transform:translateX(100%);transition:.25s;box-shadow:-8px 0 24px rgba(0,0,0,.2)}aside.open{transform:none}
.g2,.g3{grid-template-columns:1fr}main{padding:14px}.menuBtn{display:inline-grid}.top{padding:8px 12px}
.bn{display:flex;position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--g2);z-index:25;padding-bottom:env(safe-area-inset-bottom,0)}
.bn a,.bn button{flex:1;min-height:56px;display:grid;place-items:center;font-size:14px;color:var(--g5);text-decoration:none;background:none;border:0;gap:0}.bn .on{color:var(--teal);font-weight:700}
.chat{grid-template-columns:1fr}.chat .conv{display:none}.chat.open .list{display:none}.chat.open .conv{display:flex}.fab{bottom:76px}.bot{bottom:144px}.b{max-width:88%}.back{display:inline-grid!important}
table{font-size:14px}}
[hidden]{display:none!important}
.back{display:none}
.banner{background:linear-gradient(120deg,var(--navy-d),var(--navy) 55%,var(--teal));color:#fff;border-radius:20px;padding:24px;position:relative;overflow:hidden;display:flex}.banner .petal{opacity:.18;left:auto;right:auto;left:-20px;width:260px}
.chip{background:rgba(255,255,255,.18);border-radius:99px;padding:0 12px;font-size:14px}
.g4{grid-template-columns:repeat(4,1fr)}.qi{width:40px;height:40px;border-radius:12px;background:var(--teal-t);display:grid;place-items:center;color:var(--teal)}
.dg{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}.dg>.grid{align-content:start}
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.dg{grid-template-columns:1fr}}
</style>
</head>
<body>
<noscript><p style="padding:24px;font:16px Tahoma,sans-serif" dir="rtl">برای نمایش پورتال، فایل را در مرورگر (کروم، سافاری یا اج) باز کنید و جاوااسکریپت را فعال بگذارید. پیش‌نمایش ایمیل یا پیام‌رسان کار نمی‌کند.</p></noscript>
<div id="login" class="login" hidden></div>
<div id="shell" class="app" hidden>
 <aside id="side" aria-label="منوی اصلی"></aside>

  <div class="top">

  </div>
  <main id="main"></main>
 </div>
</div>

function pubM(){openM(`<h2>انتشار ${S.tab=='news'?'خبر':'رویداد'}</h2><div style="display:grid;gap:10px;margin-top:12px"><input id="pt" placeholder="عنوان"><button class="btn" onclick="if(pt.value){(S.tab=='news'?S.news:S.events).unshift(S.tab=='news'?[pt.value,'۲۷ آبان ۱۴۰۵',ME.unit]:[pt.value,'به‌زودی','آنلاین']);closeM();go()}">انتشار</button></div>`)}

R.notes=()=>`${H('یادداشت‌های من','خصوصی و فقط برای شما',`<button class="btn" onclick="S.notes.unshift(['','#FFF3B0']);go()">${ic('plus')} یادداشت جدید</button>`)}
${S.notes.length?`<div class="grid g3">${S.notes.map((n,i)=>`<div class="sticky" style="background:${n[1]}"><textarea aria-label="متن یادداشت" placeholder="بنویسید…" oninput="S.notes[${i}][0]=this.value">${n[0]}</textarea><div class="row">${['#FFF3B0','#D7F3F8','#FBD9E2','#DDF2D3'].map(c=>`<button aria-label="رنگ" onclick="S.notes[${i}][1]='${c}';go()" style="width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:${c};cursor:pointer"></button>`).join('')}<span class="sp"></span><button class="ib" aria-label="حذف" onclick="S.notes.splice(${i},1);go()">${ic('trash')}</button></div></div>`).join('')}</div>`:`<div class="card empty">${petals()}<p>هنوز یادداشتی ندارید. با دکمه «یادداشت جدید» شروع کنید.</p></div>`}`;

R.profile=()=>`${H('پروفایل من')}<div class="grid g2"><div class="card"><div class="row">${av(ME.name,'lg')}<div><h2>${ME.name}</h2><span class="bdg">${ROLES[S.role]}</span></div></div>
<div style="display:grid;gap:8px;margin-top:14px"><label>سمت<input value="${ME.title}" disabled></label><label>واحد / استان<input value="${ME.unit} · ${ME.prov}" disabled></label><label>مدیر مستقیم<input value="${ME.boss}" disabled></label><label>تلفن<input id="pt1" value="${ME.tel}"></label><label>ایمیل<input id="pt2" value="${ME.mail}"></label><label>شروع همکاری<input value="${ME.since}" disabled></label>
<div class="row"><button class="btn" onclick="ME.tel=pt1.value;ME.mail=pt2.value;toast('اطلاعات ذخیره شد')">ذخیره</button><button class="btn ghost" onclick="pwM()">تغییر رمز عبور</button></div></div></div>
<div class="card"><h2>کودوس‌های دریافتی</h2>${S.kudos.filter(k=>k[1]==ME.name).map(kd).join('')||'<div class="empty">هنوز کودوسی دریافت نکرده‌اید.</div>'}</div></div>`;
function pwM(){openM(`<h2>تغییر رمز عبور</h2><div style="display:grid;gap:10px;margin-top:12px"><input type="password" placeholder="رمز فعلی"><input type="password" placeholder="رمز جدید"><button class="btn" onclick="closeM();toast('رمز عبور تغییر کرد')">ثبت</button></div>`)}

R.admin=()=>{if(!can('admin'))return `${H('مدیریت دسترسی‌ها')}<div class="card empty">${ic('shield')}<p>این بخش فقط برای ادمین مرکزی در دسترس است. از سوییچ نقش بالای صفحه استفاده کنید.</p></div>`;
const T=[['tree','ساختار سازمانی'],['users','کاربران'],['mx','ماتریس دسترسی'],['ch','کانال‌ها و اسناد']];
const body={tree:`<div class="card"><b>دفتر مرکزی (تهران)</b><ul style="margin:6px 24px;line-height:2.2"><li>آذربایجان شرقی<ul style="margin-right:20px"><li>شعبه تبریز</li><li>مرکز کودکان تبریز</li></ul></li><li>اصفهان<ul style="margin-right:20px"><li>شعبه اصفهان</li></ul></li><li>کرمان<ul style="margin-right:20px"><li>مرکز رفسنجان</li></ul></li></ul><b>دپارتمان‌ها:</b> <span class="bdg">مالی</span> <span class="bdg">جذب مشارکت</span> <span class="bdg">پشتیبانی</span> <span class="bdg">مددکاری</span></div>`,
users:`<div class="card"><div class="row" style="margin-bottom:8px"><h2 class="sp">کاربران</h2><button class="btn sm" onclick="S.users.push(['کاربر جدید','کارمند عادی','واحد مالی',1]);go()">${ic('plus')} افزودن</button></div><table><tr><th>نام</th><th>نقش</th><th>واحد</th><th>وضعیت</th></tr>${S.users.map((u,i)=>`<tr><td>${u[0]}</td><td><select aria-label="نقش" onchange="S.users[${i}][1]=this.value">${Object.values(ROLES).map(r=>`<option ${r==u[1]?'selected':''}>${r}</option>`).join('')}</select></td><td>${u[2]}</td><td><button class="btn sm ${u[3]?'':'ghost'}" onclick="S.users[${i}][3]=!S.users[${i}][3];go()">${u[3]?'فعال':'غیرفعال'}</button></td></tr>`).join('')}</table></div>`,
mx:`<div class="card" style="overflow:auto"><table><tr><th>نقش</th>${SEC.map(s=>`<th>${s}</th>`).join('')}</tr>${Object.keys(ROLES).map(r=>`<tr><td>${ROLES[r]}</td>${SEC.map((s,j)=>`<td><input type="checkbox" style="width:24px;min-height:24px" aria-label="${ROLES[r]} ${s}" ${S.mx[r][j]?'checked':''} onchange="S.mx['${r}'][${j}]=this.checked"></td>`).join('')}</tr>`).join('')}</table></div>`,
ch:`<div class="grid g2"><div class="card"><h2>کانال‌های چت</h2>${S.chs.map(c=>`<p class="row" style="margin-top:8px"><span class="sp">${c.n}</span><span class="bdg">${c.g}</span></p>`).join('')}</div><div class="card"><h2>سطح دسترسی اسناد</h2>${S.docs.map(d=>`<p class="row" style="margin-top:8px"><span class="sp">${d[0]}</span><span class="bdg">${d[3]}</span></p>`).join('')}</div></div>`};
return `${H('مدیریت واحدها و دسترسی‌ها')}<div class="tabs">${T.map(t=>`<button class="${S.atab==t[0]?'on':''}" onclick="S.atab='${t[0]}';go()">${t[1]}</button>`).join('')}</div>${body[S.atab]}`};

R.learn=()=>{const st=S.steps,pc=Math.round(S.prog.size/st.length*100),l=st.map((s,i)=>[s,i]).filter(([s])=>(s[0]+s[1]).includes(S.lq));
return `${H('آشنایی با مهرآفرین','مسیر گام‌به‌گام برای همکاران جدید')}<div class="card" style="margin-bottom:16px"><div class="row"><b class="sp">پیشرفت شما</b><b>${fa(pc)}٪</b></div><div class="pb" role="progressbar" aria-valuenow="${pc}"><i style="width:${pc}%"></i></div></div>
<div class="srch" style="margin-bottom:12px"><span>${ic('search')}</span><input placeholder="جستجو در محتوا" value="${S.lq}" oninput="S.lq=this.value;go(1)" aria-label="جستجو"></div>
<div class="grid">${l.length?l.map(([s,i])=>`<div class="card row" style="align-items:flex-start"><span class="av" style="background:${S.prog.has(i)?'var(--teal)':'var(--g5)'}">${fa(i+1)}</span><div class="sp"><h3>${s[0]}</h3><p>${s[1]}</p></div><button class="btn sm ${S.prog.has(i)?'':'ghost'}" onclick="S.prog.has(${i})?S.prog.delete(${i}):S.prog.add(${i});go(1)">${S.prog.has(i)?'خوانده شد ✓':'مطالعه شد'}</button></div>`).join(''):`<div class="card empty">نتیجه‌ای پیدا نشد.</div>`}</div>`};

/* ===== چت‌بات (آماده اتصال به سرویس واقعی) ===== */
const BOT_Q={'مرخصی را چطور ثبت کنم؟':'فرم مرخصی را از مخزن اسناد دریافت و به سرپرست واحد ارسال کنید.','کودوس چیست؟':'کودوس یک جمله قدردانی عمومی برای همکاران است؛ بدون امتیاز و رتبه‌بندی.','آیین‌نامه‌ها کجاست؟':'در بخش «مخزن اسناد»، دسته آیین‌نامه‌ها.'};
/* برای اتصال به چت‌بات واقعی، این تابع را با fetch به سرور جایگزین کنید */
async function askBot(q){return BOT_Q[q]||'سؤال شما ثبت شد؛ به‌زودی دستیار هوشمند پاسخ می‌دهد.'}
function toggleBot(){const b=$('#bot');b.hidden=!b.hidden;if(!b.hidden)b.innerHTML=`<header class="row"><b class="sp">دستیار آشنایی</b><button class="ib" style="color:#fff" onclick="toggleBot()" aria-label="بستن">${ic('x')}</button></header><div class="bm" id="bm"><div class="b">سلام! من دستیار مهرآفرین هستم. چطور کمکتان کنم؟</div>${Object.keys(BOT_Q).map(q=>`<button class="btn ghost sm" onclick="ask(this.textContent)">${q}</button>`).join('')}</div><form class="row" style="padding:8px;flex-wrap:nowrap" onsubmit="event.preventDefault();ask(bi.value);bi.value=''"><input id="bi" placeholder="سؤال بپرسید…" aria-label="سؤال"><button class="btn" aria-label="ارسال">${ic('send')}</button></form>`}
async function ask(q){if(!q)return;const m=$('#bm');m.insertAdjacentHTML('beforeend',`<div class="b me">${q}</div>`);const a=await askBot(q);m.insertAdjacentHTML('beforeend',`<div class="b">${a}</div>`);m.scrollTop=m.scrollHeight}

/* ===== مسیریابی و قاب اصلی ===== */
function go(keep){const p=(location.hash.slice(2)||'dash').split('/')[0],pg=R[p]&&p!='login'?p:'dash',lg=false;
 $('#login').hidden=!lg;$('#shell').hidden=lg;$('#bn').hidden=lg;$('#fab').hidden=lg;if(lg){$('#bot').hidden=true;$('#login').innerHTML=R.login();return}
 const f=keep&&document.activeElement.tagName=='INPUT'?document.activeElement.selectionStart:null;
 $('#main').innerHTML=R[pg]();if(pg=='chat')msgs();if(pg=='docs')docList();
 if(f!==null){const i=$('#main input');if(i){i.focus();i.setSelectionRange(f,f)}}
 $('#side').innerHTML=`<div class="brand">${logo(34)} مهرآفرین</div>`+NAV.map(n=>`<a href="#/${n[0]}" class="${n[0]==pg?'on':''}" onclick="side.classList.remove('open')">${ic(n[2])}${n[1]}</a>`).join('');
 $('#bn').innerHTML=NAV.slice(0,4).map(n=>`<a href="#/${n[0]}" class="${n[0]==pg?'on':''}">${ic(n[2])}${n[1].split(' ')[0]}</a>`).join('')+`<button onclick="side.classList.toggle('open')">${ic('menu')}منو</button>`;
 $('#fab').innerHTML=ic('bot');$('.menuBtn').innerHTML=ic('menu');$('.top .ib[aria-label=اعلان‌ها]').innerHTML=ic('bell');$('#meAv').innerHTML=av(ME.name);
 window.scrollTo(0,0)}
$('#roleSel').innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#roleSel').onchange=e=>{S.role=e.target.value;go()};
addEventListener('hashchange',()=>{S.open=0;go()});go();
</script>
</body>
</html>
